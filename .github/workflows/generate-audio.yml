name: Generate audio demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache downloaded model weights
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            kokoro-${{ runner.os }}-py312-

      - name: Install CPU speech model
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate the project introduction
        run: python model.py --output-dir artifacts

      - name: Upload the audio demo
        uses: actions/upload-artifact@v7
        id: demo_artifact
        with:
          name: audio-generation-demo
          path: artifacts/
          if-no-files-found: error

      - name: Add demo link to run summary
        env:
          ARTIFACT_URL: ${{ steps.demo_artifact.outputs.artifact-url }}
        run: |
          {
            echo "## Audio generation demo"
            echo "[Download the generated WAV and run details](${ARTIFACT_URL})"
            echo
            echo "Generated locally in the workflow with Kokoro-82M on CPU."
          } >> "$GITHUB_STEP_SUMMARY"
