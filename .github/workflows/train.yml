name: Pronunciation-to-audio demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Train the audio student from the Fish teacher sample
        run: python train_student.py --epochs 12 --output-dir artifacts/train

      - name: Generate manifesto with the trained student
        run: python model.py --demo --model artifacts/train/student_model.pt --output-dir artifacts/demo

      - name: Upload audio and run details
        uses: actions/upload-artifact@v7
        id: audio_artifact
        if: always()
        with:
          name: manifesto-student-audio
          path: artifacts/
          if-no-files-found: error

      - name: Add demo link to run summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.audio_artifact.outputs.artifact-url }}
        run: |
          {
            echo "## Student audio demo"
            echo "[Download the student WAV, model, metrics, and training curve](${ARTIFACT_URL})"
            echo
            echo 'The student was trained from Fish Audio teacher speech and generated this WAV without calling Fish Audio at inference.'
            echo
            echo '```text'
            cat artifacts/train/metrics.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
