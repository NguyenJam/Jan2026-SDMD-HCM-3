name: CMUdict audio smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install --yes espeak-ng

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate and validate pronunciation audio
        run: python model.py --text "Hello world" --output-dir artifacts

      - name: Upload audio and run details
        uses: actions/upload-artifact@v4
        with:
          name: cmudict-audio-preview
          path: artifacts/
          if-no-files-found: error
