name: Pronunciation-to-audio demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install --yes espeak-ng

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate eSpeak baseline
        run: python model.py --text "Hello world" --engine espeak --output-dir artifacts/espeak

      - name: Generate Fish teacher sample
        if: ${{ github.event_name != 'pull_request' }}
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: python model.py --text "Hello world" --engine fish --output-dir artifacts/fish

      - name: Upload audio and run details
        uses: actions/upload-artifact@v7
        id: audio_artifact
        if: always()
        with:
          name: audio-demo
          path: artifacts/
          if-no-files-found: error

      - name: Add demo link to run summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.audio_artifact.outputs.artifact-url }}
        run: |
          {
            echo "## Audio preview"
            echo "[Download the generated WAV and run summary](${ARTIFACT_URL})"
            echo
            echo 'The artifact includes the eSpeak baseline.'
            if [ -f artifacts/fish/metrics.txt ]; then
              echo 'It also includes a Fish Audio teacher sample.'
              echo
              echo '```text'
              cat artifacts/fish/metrics.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
