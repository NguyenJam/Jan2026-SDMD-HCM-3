name: Pronunciation-to-audio demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate README narration
        run: python model.py --readme --output-dir artifacts/fish

      - name: Upload audio and run details
        uses: actions/upload-artifact@v7
        id: audio_artifact
        if: always()
        with:
          name: audio-demo
          path: artifacts/
          if-no-files-found: error

      - name: Add demo link to run summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.audio_artifact.outputs.artifact-url }}
        run: |
          {
            echo "## README narration"
            echo "[Download the generated WAV and run summary](${ARTIFACT_URL})"
            echo
            echo 'Fish Audio narrated the readable text in README.md. Code blocks and Markdown formatting were left out.'
            echo
            echo '```text'
            cat artifacts/fish/metrics.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
